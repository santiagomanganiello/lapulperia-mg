name: CI

# Corre en cada push a main y en cada pull request (incluidos los de Dependabot).
on:
  push:
    branches: [main]
  pull_request:

# Si llegan dos pushes seguidos, se cancela el run viejo y queda solo el último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm test

      # No se cargan secretos: el sitio degrada a agenda vacía si faltan las
      # variables de Supabase (ver isSupabaseConfigured).
      - name: Build
        run: npm run build
