name: CI

# Corre en cada push a main y en cada pull request (incluidos los de Dependabot).
on:
  push:
    branches: [main]
  pull_request:

# Si llegan dos pushes seguidos, se cancela el run viejo y queda solo el último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm test

      # No se cargan secretos: el sitio degrada a agenda vacía si faltan las
      # variables de Supabase (ver isSupabaseConfigured).
      - name: Build
        run: npm run build

  e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Playwright levanta `astro dev` solo (ver playwright.config.ts).
      - name: Smoke E2E
        run: npm run test:e2e

      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
